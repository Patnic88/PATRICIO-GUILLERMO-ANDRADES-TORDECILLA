name: Lectura de fuentes oficiales BHE (temporal)
on:
  push:
    branches: [claude/diagnostico-sii-portal]
    paths: [diag/urls_crudas.txt, diag/fuentes_crudas.py]
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pypdf
      - run: python3 diag/fuentes_crudas.py
      - name: Guardar los textos en esta rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes_crudas
          git commit -q -m "Fuentes crudas BHE (temporal)" || exit 0
          git push -q origin HEAD:claude/diagnostico-sii-portal
