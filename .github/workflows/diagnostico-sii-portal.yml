name: Lectura de fuentes oficiales BHE (temporal)
on:
  push:
    branches: [claude/diagnostico-sii-portal]
    paths: [diag/urls_fuentes.txt, diag/fuentes_bhe.py, .github/workflows/diagnostico-sii-portal.yml]
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils > /dev/null
      - run: python3 diag/fuentes_bhe.py
      - name: Guardar los textos en esta rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes
          git commit -q -m "Textos de fuentes oficiales BHE (temporal)" || exit 0
          git push -q origin HEAD:claude/diagnostico-sii-portal
