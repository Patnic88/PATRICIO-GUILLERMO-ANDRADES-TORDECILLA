name: Diagnóstico portal SII (temporal)

on:
  push:
    branches: [claude/diagnostico-sii-portal]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnóstico
        run: python diagnostico-sii-portal/diag.py
