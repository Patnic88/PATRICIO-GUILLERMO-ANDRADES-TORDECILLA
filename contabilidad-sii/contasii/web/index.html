<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Contabilidad</title>
<style>
/* Layout: barra superior fija + una columna central; el inicio del mes es una ruta de 4 pasos en orden real */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --fg: #16232b;
  --muted: #586973;
  --line: #d5dee3;
  --accent: #0d6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #e0f0ef;
  --field: #768790;
  --ok: #186b37; --ok-soft: #e3f3e8;
  --warn: #8a5a00; --warn-soft: #fcf2dc;
  --bad: #b3261e; --bad-soft: #fbe6e4;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171b; --surface: #172227; --fg: #e4ecef; --muted: #9db0b8; --line: #2a3a41; --field: #66808a;
    --accent: #4fc1bd; --accent-ink: #062322; --accent-soft: #163332;
    --ok: #6fd18f; --ok-soft: #173123; --warn: #e9bb5f; --warn-soft: #30281a; --bad: #f08a80; --bad-soft: #3a1f1d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
/* La barra superior es fija: lo que se enfoca o se desplaza queda debajo de ella, no tapado */
html { scroll-padding-top: 130px; scroll-padding-bottom: 90px; }
.saltar { position: absolute; left: 8px; top: -60px; z-index: 30; background: var(--surface); padding: 8px 12px; border-radius: 8px; }
.saltar:focus { top: 8px; }
h1[tabindex="-1"]:focus { outline: none; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
/* Las pantallas con tablas (libros, pagos y cobros) usan más ancho: body.ancho */
body.ancho { --ancho: 1280px; }
.top .in { max-width: var(--ancho, 980px); margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px; cursor: pointer; color: inherit; border-radius: 8px; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.top .emp { color: var(--muted); font-size: 15px; min-width: 0; flex: 1 1 200px; display: grid; line-height: 1.3; }
.top .emp b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .emp span { font-size: 13px; white-space: nowrap; }
/* Segunda fila de la barra: mes de trabajo y pasos del mes, visible en todas las pantallas de una empresa */
.nav { border-top: 1px solid var(--line); }
.nav .in { padding: 4px 16px; gap: 4px 16px; flex-wrap: nowrap; }
.mesnav { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.mesnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 40px; min-height: 40px; cursor: pointer; font-size: 20px; line-height: 1; }
.mesnav button:hover { border-color: var(--accent); }
.mesnav select { width: auto; min-height: 40px; padding: 6px 8px; font-weight: 600; }
.pasosnav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: thin; }
.pasosnav button { font-size: 16px; border: 0; background: none; padding: 8px 6px; border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; color: var(--muted); font-weight: 600; min-height: 44px; }
.pasosnav button:hover { color: var(--fg); }
.pasosnav button[aria-current=page] { color: var(--accent); border-bottom-color: var(--accent); }
.pasosnav .ok { color: var(--ok); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
main > :empty { display: none; }
main { max-width: var(--ancho, 980px); margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }
.panel, .confirm, .msg, #form, #anu, #docConf, details { scroll-margin-top: 140px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 18px; margin: 0; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack, #f29, #rev, #lib, #lista, #cola { display: grid; gap: 12px; min-width: 0; }
#f29, #rev, #lib { gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); min-height: 46px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 6px 4px; min-height: 0; }
.btn:disabled { opacity: .65; cursor: not-allowed; }
/* Barra fina bajo el encabezado mientras el programa responde */
body.cargando .top::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: 40%; background: var(--accent); animation: carga 1s linear infinite; }
@keyframes carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { body.cargando .top::after { width: 100%; animation: none; opacity: .6; } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
label { font-weight: 600; display: grid; gap: 6px; }
label .hint { font-weight: 400; color: var(--muted); font-size: 14px; }
input[type=text], input[type=search], input[type=date], input[type=number], input[type=password], select {
  border: 1px solid var(--field); border-radius: 8px; padding: 10px 12px; background: var(--surface); min-height: 46px; width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; align-items: end; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { color: var(--muted); font-size: 14px; }
.tile .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; text-align: left; width: 100%; }
.step:hover { border-color: var(--accent); }
.step .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 19px;
  background: var(--accent-soft); color: var(--accent); }
.step.done .n { background: var(--ok-soft); color: var(--ok); }
.step .t { display: grid; gap: 2px; min-width: 0; }
.step .t b { font-size: 18px; }
.step.next { border: 2px solid var(--accent); background: var(--accent-soft); }
.step.next .st { color: var(--accent); }
.step .st { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.step.done .st { color: var(--ok); }
.pill { display: inline-block; font-size: 14px; font-weight: 600; border-radius: 99px; padding: 2px 10px; background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.msg { border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; border-left: 4px solid currentColor; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.info { background: var(--accent-soft); color: var(--fg); }
.msg ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.drop { border: 2px dashed var(--field); border-radius: 12px; padding: 32px 16px; text-align: center; display: grid; gap: 8px; place-items: center; cursor: pointer; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.drop span.muted { font-weight: 400; }
input[type=file] { min-height: 46px; max-width: 100%; }
input[type=file]::file-selector-button { font: inherit; font-weight: 600; border: 1px solid var(--field); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 14px; margin-right: 10px; cursor: pointer; }
.drop svg { width: 40px; height: 40px; color: var(--accent); }
.ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.op { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: grid; gap: 2px; }
.grupo-ops { display: grid; gap: 8px; }
.grupo-ops h3 { font-size: 15px; color: var(--muted); }
.op:hover, .op.sel { border-color: var(--accent); }
.op.sel { background: var(--accent-soft); }
.op b { font-size: 17px; } .op span { color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; justify-self: start; width: max-content; max-width: 100%; border: 1px solid var(--field); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 10px 16px; cursor: pointer; min-height: 46px; }
.seg button + button { border-left: 1px solid var(--field); }
.seg button:focus-visible { outline-offset: -4px; outline-color: var(--fg); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button[aria-pressed=true]::before { content: "✓ "; }
/* Con alto máximo, el encabezado de la tabla queda fijo y la barra horizontal siempre está a la vista */
.tablewrap { overflow: auto; max-height: calc(100vh - 200px); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tablewrap.libre { max-height: none; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 14px; color: var(--fg); font-weight: 600; background: var(--bg); position: sticky; top: 0; z-index: 1; }
td.fecha, td.nw { white-space: nowrap; }
table.bal td:first-child { position: sticky; left: 0; background: var(--surface); min-width: 220px; }
table.bal th:first-child { position: sticky; left: 0; z-index: 2; }
.monto-ok { font-size: 14px; color: var(--muted); font-weight: 400; }
.monto-ok:empty { display: none; }
.msg[tabindex="-1"]:focus { outline: none; }
.btn.danger:disabled { color: var(--muted); border-color: var(--line); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sum td { font-weight: 700; border-top: 2px solid var(--line); }
tr.head td { background: var(--bg); font-weight: 600; }
tr.anulado td { color: var(--muted); text-decoration: line-through; }
.big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hero { display: grid; gap: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
.check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.check .i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.check .i.ok { background: var(--ok-soft); color: var(--ok); } .check .i.bad { background: var(--bad-soft); color: var(--bad); }
.confirm { border: 2px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.toast { pointer-events: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 20px;
  border-radius: 8px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; display: grid; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card.add { border-style: dashed; place-items: center; color: var(--accent); font-weight: 700; min-height: 110px; }
.cardw { display: grid; gap: 2px; align-content: start; min-width: 0; }
.cardw .card { width: 100%; }
.btn.link.peligro { color: var(--bad); justify-self: start; font-size: 14px; font-weight: 600; }
.btn.link.discreto { color: var(--muted); justify-self: start; font-size: 14px; font-weight: 400; }
textarea { font: inherit; color: inherit; border: 1px solid var(--field); border-radius: 8px; padding: 10px 12px; background: var(--surface); width: 100%; min-height: 120px; resize: vertical; }
.lista-pap { display: grid; gap: 10px; }
.lista-pap .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 560px) { .lista-pap .item { grid-template-columns: 1fr; } }
.lines td input, .lines td select { min-height: 40px; padding: 6px 8px; }
dl.glos { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 16px; margin: 0; }
dl.glos dt { font-weight: 700; } dl.glos dd { margin: 0; }
@media (max-width: 560px) { .step { grid-template-columns: 44px minmax(0,1fr); } .step .st { grid-column: 2; white-space: normal; } dl.glos { grid-template-columns: 1fr; } .big { font-size: 28px; } }
@media (max-width: 900px) { .brand .txt { display: none; } .nav .in { flex-wrap: wrap; } .pasosnav { flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (forced-colors: active) { .seg button[aria-pressed=true], .op.sel, .tabs button[aria-selected=true], .pasosnav button[aria-current=page], .step.next { outline: 3px solid Highlight; outline-offset: -3px; } }
@media print { .top { position: static; } .nav, #btnAyuda, #btnEmpresas { display: none; } .tablewrap { max-height: none; overflow: visible; } }
</style>
</head>
<body>
<a class="saltar" href="#app">Ir al contenido</a>
<header class="top"><div class="in">
  <button class="brand" id="brand" type="button" aria-label="Mi Contabilidad: ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="txt">Mi Contabilidad</span></button>
  <div class="emp" id="topEmp"></div>
  <button class="btn link" id="btnAyuda" type="button">Ayuda</button>
  <button class="btn" id="btnEmpresas" type="button" hidden>Cambiar empresa</button>
</div>
<nav class="nav" id="nav" aria-label="Mes y pasos" hidden><div class="in"></div></nav></header>
<main id="app" tabindex="-1"><p class="muted">Cargando…</p></main>
<div id="aviso" class="sr" role="status" aria-live="polite"></div>

<script>
"use strict";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const S = { empresa: null, info: null, periodo: null, vista: "inicio" };
let siiTimer = null, siiGen = 0;  // consulta periódica del estado de la conexión con el SII
let siiUsuario = "";  // RUT con que se ingresó al SII en la ventana del programa
// Lo que llega del SII para una empresa mientras se está en otra pantalla: se muestra al volver a sus archivos.
const pendientesSII = {};
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n || 0)).toLocaleString("es-CL");
const nomMes = p => { const [y, m] = p.split("-"); return MESES[+m - 1] + " " + y; };
const nomMesCap = p => { const t = nomMes(p); return t[0].toUpperCase() + t.slice(1); };
const fechaLarga = iso => { const d = new Date(iso + "T12:00:00"); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const fechaCorta = iso => String(iso || "").split("-").reverse().join("-");
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const mesActual = () => hoy().slice(0, 7);
const mesMas = (p, n) => { const [y, m] = p.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const mesAnterior = () => mesMas(mesActual(), -1);
const ES_PERIODO = /^\d{4}-(0[1-9]|1[0-2])$/;
const normRut = t => String(t || "").replace(/[.\s]/g, "").toUpperCase();
const rutDeArchivo = arch => String(arch || "").replace(/\.db$/, "");
const fmtRut = t => { const [c, d] = normRut(t).split("-"); return d === undefined ? String(t || "") : c.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + d; };
const finMes = p => { const [y, m] = p.split("-").map(Number); return `${p}-${String(new Date(y, m, 0).getDate()).padStart(2,"0")}`; };
// Para buscar sin importar mayúsculas, tildes, puntos ni guiones.
const normBusca = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[.\-\s]/g, "");
// En textos ya escapados: «2026-09» pasa a «septiembre 2026» (las fechas completas no se tocan).
const amable = t => String(t).replace(/\b(20\d\d)-(0[1-9]|1[0-2])\b(?!-)/g, (_, y, m) => `${MESES[+m - 1]} ${y}`);
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

// Montos en pesos enteros: «500000», «500.000» o «$ 500.000»; también «500.000,00». Cualquier otra
// cosa (por ejemplo «500.000,50» o «1.5») es un error: no se adivinan decimales.
function montoCL(v) {
  const t = String(v ?? "").replace(/[\s$]/g, "").replace(/,0+$/, "");
  if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) return +t.replace(/\./g, "");
  return NaN;
}
const MAL_MONTO = "Escriba los montos en pesos, sin decimales: por ejemplo 1.190.000 o 1190000.";
function campoMonto(id, etiqueta, hint = "", valor = "") {
  const v = valor === "" || valor == null ? "" : Number(valor).toLocaleString("es-CL");
  return `<label for="${id}">${etiqueta}${hint ? `<span class="hint">${hint}</span>` : ""}<input id="${id}" class="monto" type="text" inputmode="numeric" autocomplete="off" value="${esc(v)}" aria-describedby="${id}_v"><span class="monto-ok" id="${id}_v"></span></label>`;
}
// Bajo cada monto se muestra cómo se entendió («= $1.190.000») o qué falta corregir.
function conectarMontos(cont) {
  cont.querySelectorAll("input.monto").forEach(inp => {
    const f = () => { const o = document.getElementById(inp.id + "_v"), v = montoCL(inp.value);
      if (o) o.textContent = !inp.value.trim() ? "" : isNaN(v) ? "Escriba solo pesos, sin decimales (ej.: 1.190.000)" : "= " + peso(v); };
    inp.addEventListener("input", f); f();
  });
}

let cargas = 0;
async function api(ruta, cuerpo) {
  const opts = cuerpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Contasii": "1" }, body: JSON.stringify(cuerpo) };
  // La consulta periódica del estado del SII (cada 2 s) no muestra la barra de carga: parpadearía siempre.
  const visible = ruta !== "sii-portal/estado";
  if (visible && ++cargas === 1) document.body.classList.add("cargando");
  try {
    let r;
    try { r = await fetch("/api/" + ruta, opts); }
    catch (e) { throw new Error("Se perdió la conexión con el programa. Cierre esta ventana y vuelva a abrir «Mi Contabilidad» con doble clic."); }
    const j = await r.json().catch(() => ({ error: "Respuesta inválida del programa." }));
    if (!r.ok) throw new Error(j.error || "Ocurrió un error.");
    return j;
  } finally {
    if (visible && --cargas === 0) document.body.classList.remove("cargando");
  }
}
const E = r => `e/${encodeURIComponent(S.empresa)}/${r}`;
// Aviso breve: se ve abajo y lo anuncia el lector de pantalla (por la región fija #aviso, una sola vez).
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t; d.setAttribute("aria-hidden", "true");
  document.body.appendChild(d); setTimeout(() => d.remove(), 5000);

const suave = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

// Bajo cada campo de fecha, la fecha escrita en palabras («martes 14 de octubre de 2026»).
function conectarFechas(cont) {
  cont.querySelectorAll("input[type=date]").forEach(inp => {
    const s = document.createElement("span"); s.className = "hint"; s.id = inp.id + "_t";
    inp.after(s); inp.setAttribute("aria-describedby", s.id);
    const f = () => { s.textContent = /^\d{4}-\d{2}-\d{2}$/.test(inp.value) ? fechaLarga(inp.value) : ""; };

function render(html) {

/* ------------------------------------------------------------ navegación */
// Datos escritos en un formulario que todavía no se registran: se pregunta antes de cambiar de pantalla o de mes.
let sucio = false;
document.addEventListener("input", ev => { if (ev.target.closest("#app form") && !ev.target.closest(".confirm")) sucio = true; });
function puedeSalir() {
  const sinImportar = document.querySelectorAll("#cola .bImp").length;
  if (!sucio && !sinImportar) return true;
  const q = sucio ? "Hay datos escritos que todavía no se registran." : `Hay ${sinImportar === 1 ? "un archivo revisado" : sinImportar + " archivos revisados"} que todavía no se importa${sinImportar === 1 ? "" : "n"}.`;
  if (!confirm(q + " ¿Salir de esta pantalla de todos modos?")) return false;
  sucio = false;
  return true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-ir], [data-irmes]");
  if (!b || !puedeSalir()) return;
  if (b.dataset.ir) return ir(b.dataset.ir);
  S.periodo = b.dataset.irmes;
  ir(S.vista, { reemplazar: true });
});

const VISTAS = { inicio: () => pantallaInicio(), archivos: () => pantallaArchivos(), movimientos: () => pantallaMovimientos(),
  f29: () => pantallaF29(), cierre: () => pantallaCierre(), libros: () => pantallaLibros(), ayuda: () => pantallaAyuda(),
  sii: () => pantallaSII() };
const PESTANAS = ["resultados", "documentos", "diario", "mayor", "balance"];
let pestana = "resultados";
// La ubicación queda en la dirección (#/empresa/mes/pantalla): recargar la ventana vuelve al mismo lugar, y
// Alt+← o el botón «atrás» del mouse vuelven a la pantalla anterior.
function rutaActual() {
  return S.empresa ? `#/${encodeURIComponent(S.empresa)}/${S.periodo}/${S.vista}${S.vista === "libros" ? "/" + pestana : ""}` : "#/";
}
function anotarRuta(reemplazar) {
  const h = rutaActual();
  if (location.hash === h || (!location.hash && h === "#/")) return;
  try { history[reemplazar ? "replaceState" : "pushState"](null, "", h); } catch (e) {}
}
window.addEventListener("popstate", () => {
  if (!puedeSalir()) { try { history.pushState(null, "", rutaActual()); } catch (e) {} return; }
  irRuta(location.hash);
});
function irRuta(h) {
  const m = /^#\/([^/]+)\/(\d{4}-(?:0[1-9]|1[0-2]))\/([a-z0-9]+)(?:\/([a-z]+))?$/.exec(h || "");
  let arch = null;
  try { if (m) arch = decodeURIComponent(m[1]); } catch (e) {}
  if (!arch) return pantallaEmpresas({ historial: true });
  const vista = VISTAS[m[3]] ? m[3] : "inicio";
  if (PESTANAS.includes(m[4])) pestana = m[4];
  if (arch !== S.empresa) return abrirEmpresa(arch, { periodo: m[2], vista, historial: true });
  S.periodo = m[2];
  return ir(vista, { historial: true });
}

let nIr = 0;
async function ir(vista, opc = {}) {
  const antes = S.vista, gen = ++nIr;
  S.vista = vista;
  if (!S.empresa) return pantallaEmpresas();
  guardar("periodo:" + S.empresa, S.periodo);
  try {
    const info = await api(E("resumen") + "?periodo=" + S.periodo);
    if (gen !== nIr) return;  // mientras tanto se pidió otra pantalla
    S.info = info;
    pintarTop();
    document.body.classList.toggle("ancho", vista === "libros" || vista === "movimientos");
    VISTAS[vista]();
    pintarNav();
    if (!opc.historial) anotarRuta(opc.reemplazar || vista === antes);
  } catch (e) { render(`<div id="x"></div>`); error($("#x"), e); }
}
function pintarTop() {
  const hay = S.empresa && S.info;
  $("#topEmp").innerHTML = hay ? `<b>${esc(S.info.nombre)}</b><span>RUT ${esc(S.info.rut)}</span>` : "";
  $("#btnEmpresas").hidden = !S.empresa;

}
const PASOS = [["inicio", "Inicio"], ["archivos", "1 Archivos"], ["movimientos", "2 Pagos y cobros"], ["f29", "3 Impuesto F29"],
  ["cierre", "4 Cerrar el mes"], ["libros", "Libros"]];
function resumenDocsMes() {
  const d = (S.info && S.info.documentos) || {};
  return [["compra", "compras"], ["venta", "ventas"], ["honorario_recibido", "boletas recibidas"], ["honorario_emitido", "boletas emitidas"]]
    .filter(([k]) => d[k]).map(([k, n]) => `${d[k].n} ${n}`).join(" · ");
}
function pasosHechos(i) {
  const n = Object.values(i.documentos || {}).reduce((s, x) => s + x.n, 0);
  return { archivos: n > 0, movimientos: i.pagos_mes > 0, f29: i.f29_registrado, cierre: i.cerrado };
}
function pintarNav() {
  const nav = $("#nav");
  if (!S.empresa || !S.info) { nav.hidden = true; return; }
  const h = pasosHechos(S.info), ant = mesMas(S.periodo, -1), sig = mesMas(S.periodo, 1);
  nav.hidden = false;
  $(".in", nav).innerHTML = `<div class="mesnav" role="group" aria-label="Mes de trabajo">
      <button type="button" data-irmes="${ant}" aria-label="Mes anterior (${esc(nomMes(ant))})" title="Mes anterior">‹</button>
      <select id="navMes" aria-label="Mes de trabajo">${opcionesMes()}</select>
      <button type="button" data-irmes="${sig}" aria-label="Mes siguiente (${esc(nomMes(sig))})" title="Mes siguiente">›</button></div>
    <div class="pasosnav">${PASOS.map(([v, t]) => `<button type="button" data-ir="${v}"${S.vista === v ? ` aria-current="page"` : ""}>${h[v] ? `<span class="ok" aria-hidden="true">✓ </span>` : ""}${esc(t)}${h[v] ? `<span class="sr"> (hecho)</span>` : ""}</button>`).join("")}</div>`;
  $("#navMes").onchange = ev => {
    if (!puedeSalir()) { ev.target.value = S.periodo; return; }
    S.periodo = ev.target.value;
    ir(S.vista, { reemplazar: true });

}
// Últimos 24 meses, el siguiente y los que tengan datos. Los meses con documentos o registros van en su propio grupo.
function opcionesMes() {
  const conDatos = new Set((S.info.periodos || []).filter(p => ES_PERIODO.test(p)));
  let desde = mesMas(mesActual(), -24), hasta = mesMas(mesActual(), 1);
  conDatos.forEach(p => { if (p < desde) desde = p; if (p > hasta) hasta = p; });
  if (S.periodo < desde) desde = S.periodo;
  if (S.periodo > hasta) hasta = S.periodo;
  const con = [], sin = [];
  for (let p = hasta; p >= desde; p = mesMas(p, -1))
    (conDatos.has(p) ? con : sin).push(`<option value="${p}"${p === S.periodo ? " selected" : ""}>${esc(nomMes(p))}</option>`);
  return (con.length ? `<optgroup label="Meses con datos">${con.join("")}</optgroup>` : "") + `<optgroup label="${con.length ? "Otros meses" : "Meses"}">${sin.join("")}</optgroup>`;
}

/* ------------------------------------------------------------ empresas */
async function pantallaEmpresas(opc = {}) {
  S.empresa = null; S.info = null; S.vista = "empresas"; nIr++;
  pintarTop(); $("#nav").hidden = true; document.body.classList.remove("ancho");
  if (!opc.historial) anotarRuta(false);
  const a = render(`<div class="stack"><h1>¿De quién es la contabilidad?</h1><p class="muted">Elija una empresa o persona, o agregue una nueva.</p></div>

  const des = $("#bDeshacerEl");

      $("#bSeguir").onclick = () => abrirEmpresa(ult.archivo);

    $("#lista").innerHTML = lista.map(e => `<div class="cardw" data-buscar="${esc(normBusca(e.nombre + " " + e.rut))}"><button class="card" type="button" data-arch="${esc(e.archivo)}"><b>${esc(e.nombre)}</b><span class="muted">RUT ${esc(e.rut)}</span><span class="small muted">${esc(e.regimen_texto)}</span></button>
        <button class="btn link discreto" type="button" data-del="${esc(e.archivo)}" data-nom="${esc(e.nombre)}" data-rut="${esc(e.rut)}" aria-label="Enviar a la papelera: ${esc(e.nombre)}">Enviar a la papelera</button></div>`).join("")

      const filtrar = () => {

async function abrirEmpresa(arch, opc = {}) {

function aBase64(file) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1] || ""); r.onerror = () => mal(new Error("No se pudo leer el archivo.")); r.readAsDataURL(file); }); }

// Pide confirmación y borra documentos importados: el programa anula su asiento y los saca del F29.
let nConfirm = 0;
function confirmarBorrado(cont, { ids, texto, motivo = "", emp = S.empresa, alListo }) {
  const origen = document.activeElement, id = "cb" + (++nConfirm);
  // Al cerrar, el foco vuelve al botón que abrió la confirmación (si sigue en pantalla).
  const cerrar = () => { cont.innerHTML = ""; if (origen && document.body.contains(origen)) origen.focus(); };
  cont.innerHTML = `<div class="confirm" role="group" aria-labelledby="${id}q"><b id="${id}q">${esc(texto)}</b>
    <span id="${id}e">El programa anula su registro contable (queda en el Libro Diario como anulado) y los quita del F29 y de los libros. Si vuelve a importar el archivo, se registran de nuevo.</span>
    <label>Motivo<input type="text" class="bMot" value="${esc(motivo)}" placeholder="Ej.: importado en la empresa equivocada" aria-describedby="${id}q ${id}e"></label>
    <div class="row"><button class="btn danger bSi" type="button">Sí, borrar</button><button class="btn bCan" type="button">Cancelar</button></div><div class="bErr"></div></div>`;
  $(".bCan", cont).onclick = cerrar;
  cont.onkeydown = ev => { if (ev.key === "Escape" && $(".confirm", cont)) { ev.preventDefault(); cerrar(); } };
  $(".bSi", cont).onclick = async () => {
    const b = $(".bSi", cont); b.disabled = true;
    try {
      const r = await api(`e/${encodeURIComponent(emp)}/documentos-eliminar`, { ids, motivo: $(".bMot", cont).value });
      cont.innerHTML = `<div class="msg ok" role="status" tabindex="-1"><b>Listo: ${r.eliminados} documento(s) borrado(s).</b>
        <span>${r.contra_asientos.length ? `Su registro contable quedó anulado (N° ${r.contra_asientos.join(", ")}).` : "No había un registro contable vigente que anular."}</span>
        ${r.ya_borrados ? `<span>${r.ya_borrados} ya estaban borrados.</span>` : ""}</div>`
        + (r.alertas.length ? `<div class="msg warn"><ul>${r.alertas.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : "");
      toast("Documentos borrados");
      $(".msg", cont).focus();
      if (alListo) await alListo(r);
    } catch (e) { b.disabled = false; error($(".bErr", cont), e); $(".bMot", cont).focus(); }
  };
  // Enter confirma y Escape cancela. La confirmación puede estar dentro de otro formulario (la boleta a
  // mano): sin esto, Enter enviaría ese formulario.
  $(".bMot", cont).onkeydown = ev => {
    if (ev.key === "Enter") { ev.preventDefault(); ev.stopPropagation(); $(".bSi", cont).click(); }
  };
  $(".bMot", cont).focus();
}
// Muestra un archivo para revisarlo e importarlo. La tarjeta queda amarrada a la empresa y al mes de la

async function analizarContenido(nombre, contenido, origen, opc = {}) {
  const emp = opc.emp || S.empresa, per = S.periodo;
  const EE = r => `e/${encodeURIComponent(emp)}/${r}`;
  const file = { name: nombre };
  const box = document.createElement("div"); box.className = "panel"; $("#cola").prepend(box);
  box.innerHTML = `<b>${esc(file.name)}</b><p class="muted">Revisando…</p>`;
  box.scrollIntoView({ block: "nearest", behavior: suave() });
  try {
    const r = await api(EE("analizar"), { contenido, nombre });
    const otroMes = r.mes_sugerido && r.mes_sugerido !== per;
    const esBoleta = r.tipo.startsWith("honorario");
    // Descargado en la ventana del SII con la sesión de otro RUT: las boletas son de ese RUT, no de esta empresa.
    const usuario = opc.usuario || "", ajeno = usuario && normRut(usuario) !== normRut(rutDeArchivo(emp));
    box.innerHTML = `<div class="row" style="justify-content:space-between"><b>${esc(file.name)}</b><span class="pill">${esc(NOMBRE_TIPO[r.tipo])}</span></div>
      ${esBoleta ? `<label class="row" style="gap:8px">Estas boletas son
        <select class="selT" style="width:auto"><option value="honorario_recibido" ${r.tipo === "honorario_recibido" ? "selected" : ""}>recibidas (usted pagó)</option><option value="honorario_emitido" ${r.tipo === "honorario_emitido" ? "selected" : ""}>emitidas (usted cobró)</option></select></label>` : ""}
      ${origen ? `<p class="small muted">${esc(origen)}</p>` : ""}
      <p>${r.documentos} documentos por un total de <b>${peso(r.total)}</b>.</p>
      ${r.omitidas ? `<div class="msg warn">${r.omitidas} fila(s) parecen boletas, pero su número no se pudo leer: no se importarán. Al importar verá cuáles son.</div>` : ""}
      ${otroMes ? `<div class="msg warn">Los documentos son mayormente de <b>${esc(nomMes(r.mes_sugerido))}</b>, pero usted está trabajando en <b>${esc(nomMes(per))}</b>. Elija abajo el mes del registro del SII al que corresponde el archivo.</div>` : ""}
      ${ajeno && esBoleta ? `<div class="msg bad" role="alert"><b>Este informe se descargó con la sesión del RUT ${esc(usuario)}, no con el de esta empresa (RUT ${esc(fmtRut(rutDeArchivo(emp)))}).</b>
        <span>Las boletas de honorarios se consultan con la sesión del propio contribuyente: estas son del RUT ${esc(usuario)}. No se pueden importar aquí.</span><div class="row llevar"></div></div>` : ""}
      ${ajeno && !esBoleta ? `<div class="msg warn"><b>Este archivo se descargó con la sesión del RUT ${esc(usuario)}, no con el de esta empresa (RUT ${esc(fmtRut(rutDeArchivo(emp)))}).</b>
        <label class="row" style="gap:8px;font-weight:400"><input type="checkbox" class="chkAjeno"> Ingresé como usuario autorizado y el archivo es de esta empresa</label></div>` : ""}
      <div class="row"><label class="row" style="gap:8px">Registrar en el mes
        <select class="selP" style="width:auto">${[per, r.mes_sugerido].filter((v, i, a) => v && a.indexOf(v) === i).map(p => `<option value="${p}">${esc(nomMes(p))}</option>`).join("")}</select></label>
        <button class="btn primary bImp" type="button">Importar</button><button class="btn bNo" type="button">Descartar</button></div><div class="res"></div>`;
    $(".bNo", box).onclick = () => box.remove();
    if (esBoleta) $(".selT", box).onchange = () => $(".pill", box).textContent = NOMBRE_TIPO[$(".selT", box).value];
    if (ajeno && esBoleta) {
      $(".bImp", box).remove();
      api("empresas").then(d => {
        const otra = d.empresas.find(e => rutDeArchivo(e.archivo) === normRut(usuario));
        if (!otra || !$(".llevar", box)) return;
        $(".llevar", box).innerHTML = `<button class="btn" type="button">Dejarlo en la contabilidad de ${esc(otra.nombre)}</button>`;
        $(".llevar button", box).onclick = () => {

      return true;
    }
    if (ajeno) { $(".bImp", box).disabled = true; $(".chkAjeno", box).onchange = () => $(".bImp", box).disabled = !$(".chkAjeno", box).checked; }
    $(".bImp", box).onclick = async () => {
      const b = $(".bImp", box); b.disabled = true; b.textContent = "Importando…";
      try {
        const x = await api(EE("importar"), { contenido, tipo: esBoleta ? $(".selT", box).value : r.tipo, periodo: $(".selP", box).value, nombre: file.name });
        b.remove(); $(".bNo", box).remove();
        // Lo registrado ya no cambia: el tipo y el mes quedan fijos en la tarjeta.
        box.querySelectorAll(".selT, .selP, .chkAjeno").forEach(x => x.disabled = true);

          ${x.alertas.length ? `<div class="msg warn"><b>Para revisar con su contador (${x.alertas.length}):</b><ul>${x.alertas.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
          ${(x.documentos || []).length ? `<div><button class="btn link peligro bDes" type="button">Deshacer esta importación</button></div><div class="desConf"></div>` : ""}`;
        if ((x.documentos || []).length) $(".bDes", box).onclick = () => confirmarBorrado($(".desConf", box), { ids: x.documentos, emp,
          texto: `¿Deshacer la importación de «${file.name}»? Se borrarán los ${x.documentos.length} documentos que registró.`,

        toast("Archivo importado");
      } catch (e) { b.disabled = false; b.textContent = "Importar"; error($(".res", box), e); }
    };
    return true;
  } catch (e) { box.innerHTML = `<b>${esc(file.name)}</b>`; const d = document.createElement("div"); box.appendChild(d); error(d, e); return false; }
}
