const TEXTO_OPC = { impuesto_unico: v => `impuesto único ${peso(+v)}`, tasa_ppm: v => `tasa de PPM ${pct(v)}`,
  factor_uso_comun: v => `proporción de IVA de uso común ${pct(v)}`, remanente_anterior: v => `IVA a favor del mes anterior ${peso(+v)}`,
  papel: () => "no emite documentos electrónicos" };
async function pantallaF29(opc) {
  if (!opc) opc = opcF29Guardadas();
  guardar(claveOpcF29(), Object.keys(opc).length ? JSON.stringify(opc) : null);
  const a = render(`<div class="stack"><h1>Impuesto de ${esc(nomMes(S.periodo))}</h1>
    <p class="muted">Este cálculo es un borrador de apoyo. Antes de declarar, compárelo con la propuesta que le muestra el SII en sii.cl.</p>
    ${S.periodo >= mesActual() && !S.info.cerrado ? `<div class="msg info">${esc(nomMesCap(S.periodo))} todavía no termina: el cálculo usa solo los documentos registrados hasta hoy.</div>` : ""}</div>
    <div id="f29"><p class="muted">Calculando…</p></div>`);
  const qs = new URLSearchParams({ periodo: S.periodo, ...opc });
  try {
    const r = await api(E("f29") + "?" + qs);
    if (!$("#f29")) return;
    const L = Object.fromEntries(r.lineas.map(x => [x.clave, x]));
    const sinUtm = !S.info.utm, usadas = Object.keys(opc);
    $("#f29").innerHTML = `
      <div class="panel hero">
        <span class="muted">Total a pagar al SII</span><span class="big">${peso(r.total)}</span>
        <span>Plazo: hasta el <b>${esc(fechaLarga(r.vencimiento))}</b></span>
        ${r.remanente_siguiente ? `<span class="pill ok" style="justify-self:start">Le queda un IVA a favor de ${peso(r.remanente_siguiente)} para el próximo mes</span>` : ""}
        <span class="small muted">${S.info.cerrado ? "Mes cerrado." : r.contabilizado ? "Ya está registrado en la contabilidad." : `Borrador: falta confirmarlo. <button class="btn link" type="button" id="irConf">Ir a confirmar ↓</button>`}</span>
      </div>
      ${r.alertas.length ? `<div class="msg warn"><b>Revise esto antes de declarar:</b><ul>${r.alertas.map(t => `<li>${amable(esc(t))}</li>`).join("")}</ul></div>` : ""}
      ${usadas.length ? `<div class="msg info"><span><b>Calculado con:</b> ${usadas.map(k => esc(TEXTO_OPC[k](opc[k]))).join(" · ")}.</span>
        <div class="row"><button class="btn" type="button" id="opcCambiar">Cambiar</button><button class="btn" type="button" id="opcQuitar">Quitar y recalcular</button></div></div>` : ""}
      ${sinUtm ? `<div class="msg warn"><b>Falta la UTM de ${esc(nomMes(S.periodo))}.</b><span>Se usa para actualizar el IVA a favor del mes anterior y para el impuesto de los trabajadores. Búsquela en sii.cl, sección «Valores y fechas», y escríbala aquí:</span>
        <div class="row" style="align-items:end"><div style="max-width:240px">${campoMonto("utmV", "Valor de la UTM", "Ej.: 72.151")}</div><button class="btn" type="button" id="utmG">Guardar UTM</button></div><div id="utmE"></div></div>` : ""}
      <div class="tablewrap libre"><table><thead><tr><th>Concepto</th><th class="num">Monto</th><th>Código F29</th></tr></thead><tbody>
        ${["debito_fiscal", "iva_retenido_fc", "credito_fiscal", "credito_uso_comun", "remanente_anterior", "iva_determinado", "remanente_siguiente", "base_ppm", "ppm", "retencion_honorarios", "impuesto_unico"]
          .filter(k => L[k] && (L[k].monto || ["debito_fiscal", "credito_fiscal", "iva_determinado", "ppm"].includes(k)))
          .map(k => `<tr><td><b>${esc(EXPLICA[k] || L[k].texto)}</b><br><span class="small muted">${esc(L[k].texto)}</span></td><td class="num">${peso(L[k].monto)}</td><td class="small muted">${esc(L[k].codigo) || "—"}</td></tr>`).join("")}
        <tr class="sum"><td>Total a pagar</td><td class="num">${peso(r.total)}</td><td class="small muted">${esc(L.total_a_pagar?.codigo || "")}</td></tr>
      </tbody></table></div>
      ${r.verificar.length ? `<details><summary>Datos legales usados que deben confirmarse (${r.verificar.length})</summary><div class="stack small">
        <p>Estos valores se obtuvieron de fuentes oficiales en forma indirecta, sin lectura directa de la norma. Su contador debe confirmarlos.</p>
        <ul>${r.verificar.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div></details>` : ""}
      <details id="avz"><summary>Opciones avanzadas (para su contador)</summary><form class="stack" id="fAv" novalidate>
        <p class="small muted">Lo que escriba aquí se recuerda para ${esc(nomMes(S.periodo))} de esta empresa y se muestra sobre el total.</p>
        <div class="grid2">
          ${campoMonto("oIU", "Impuesto único de trabajadores ($)", "Del libro de remuneraciones", opc.impuesto_unico || "")}
          <label for="oPPM">Tasa de PPM (%)<span class="hint">Obligatoria en régimen 14 A. Ej.: 1</span><input id="oPPM" type="number" min="0" step="0.001" value="${esc(opc.tasa_ppm || "")}"></label>
          <label for="oUC">Proporción IVA uso común (%)<input id="oUC" type="number" min="0" max="100" step="0.01" value="${esc(opc.factor_uso_comun || "")}"></label>
          ${campoMonto("oRem", "IVA a favor del mes anterior ($)", "Solo si no está registrado", opc.remanente_anterior || "")}
        </div>
        <label class="row" style="gap:8px;font-weight:400"><input type="checkbox" id="oPap" ${opc.papel ? "checked" : ""}> No emite documentos electrónicos (plazo hasta el día 12)</label>
        <div id="avErr"></div><div><button class="btn" type="submit">Recalcular</button></div></form></details>
      ${S.info.cerrado ? `<div class="msg ok">El mes está cerrado.</div>` : r.contabilizado
        ? `<div class="msg ok" id="f29Listo" tabindex="-1"><b>El impuesto de este mes ya está registrado en la contabilidad.</b>
            <span>Si necesita corregirlo, anule ese registro en «Registrar pagos y cobros» y vuelva a confirmar aquí.</span>
            <div><button class="btn" type="button" id="irPagoF29">Cuando lo pague en sii.cl: registrar el pago</button></div></div>`
        : `<div class="panel" id="pConf"><h2>¿El cálculo coincide con la propuesta del SII?</h2>
           <p class="muted">Al confirmar, el programa registra en la contabilidad el impuesto por pagar y guarda el IVA a favor para el próximo mes.</p>
           <p><b>Esto no declara ni paga en el SII.</b> La declaración y el pago se hacen en sii.cl.</p>
           <details><summary>No coincide: ¿qué hago?</summary><ol class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
             <li>Revise que subió todos los archivos del mes (<button class="btn link" type="button" data-ir="archivos">paso 1</button>).</li>
             <li>Compare línea por línea con la propuesta del SII, usando la columna «Código F29».</li>
             <li>Si tiene trabajadores, una tasa de PPM propia o IVA de uso común, use «Opciones avanzadas».</li>
             <li>Si sigue sin coincidir, consulte a su contador antes de confirmar.</li></ol></details>
           <div id="cf"><button class="btn primary" type="button" id="bConf">Sí, registrar en la contabilidad</button></div></div>`}`;
    conectarMontos($("#f29"));
    if ($("#opcCambiar")) $("#opcCambiar").onclick = () => { $("#avz").open = true; $("#avz").scrollIntoView({ behavior: suave(), block: "start" }); ($("#oIU")).focus(); };
    if ($("#opcQuitar")) $("#opcQuitar").onclick = () => pantallaF29({});
    $("#fAv").onsubmit = ev => { ev.preventDefault();
      const iu = montoCL($("#oIU").value), rem = montoCL($("#oRem").value);
      if (isNaN(iu) || isNaN(rem)) return error($("#avErr"), MAL_MONTO);
      const o = {}; if ($("#oIU").value.trim()) o.impuesto_unico = String(iu); if ($("#oPPM").value) o.tasa_ppm = $("#oPPM").value;
      if ($("#oUC").value) o.factor_uso_comun = $("#oUC").value; if ($("#oRem").value.trim()) o.remanente_anterior = String(rem); if ($("#oPap").checked) o.papel = "1";
      pantallaF29(o); };
    if (sinUtm) $("#utmG").onclick = async () => {
      const v = montoCL($("#utmV").value);
      if (isNaN(v) || !v) return error($("#utmE"), new Error("Escriba el valor de la UTM en pesos, por ejemplo 72.151."));
      $("#utmG").disabled = true;
      try { await api("utm", { periodo: S.periodo, valor: v }); toast("UTM guardada"); S.info.utm = 1; pantallaF29(opc); } catch (e) { $("#utmG").disabled = false; error($("#utmE"), e); } };
    if ($("#irConf")) $("#irConf").onclick = () => { $("#pConf").scrollIntoView({ behavior: suave(), block: "start" }); $("#bConf").focus({ preventScroll: true }); };
    if ($("#irPagoF29")) $("#irPagoF29").onclick = () => { opPendiente = "pago_f29"; ir("movimientos"); };
    const bc = $("#bConf");
    if (bc) bc.onclick = () => {
      $("#cf").innerHTML = `<div class="confirm" role="group" aria-labelledby="cfQ"><b id="cfQ" tabindex="-1">¿Confirmar el impuesto de ${esc(nomMes(S.periodo))} por ${peso(r.total)}?</b><div id="cfE"></div>
        <div class="row"><button class="btn primary" type="button" id="cfSi">Sí, confirmar</button><button class="btn" type="button" id="cfNo">Cancelar</button></div></div>`;
      $("#cfNo").onclick = () => pantallaF29(opc);
      $("#cf").onkeydown = ev => { if (ev.key === "Escape") pantallaF29(opc); };
      $("#cfQ").focus();
      $("#cfSi").onclick = async () => {
        $("#cfSi").disabled = true;
        try {
          const x = await api(E("f29-confirmar"), { periodo: S.periodo, ...opc });
          toast(x.numero ? `Impuesto registrado (N° ${x.numero})` : "Impuesto registrado");
          ir("f29", { reemplazar: true });
        } catch (e) { $("#cfSi").disabled = false; error($("#cfE"), e); }
      };
    };
  } catch (e) {
    error($("#f29"), e);
    // Una opción guardada que el cálculo no acepta no debe dejar la pantalla sin salida.
    if (Object.keys(opc).length && $("#f29")) {
      $("#f29").insertAdjacentHTML("beforeend", `<div><button class="btn" type="button" id="opcQuitar2">Quitar las opciones avanzadas y recalcular</button></div>`);
      $("#opcQuitar2").onclick = () => pantallaF29({});
    }
  }
}

/* ------------------------------------------------------------ paso 4: revisión y cierre */
async function pantallaCierre() {
  const i = S.info, enCurso = S.periodo >= mesActual(), sig = mesMas(S.periodo, 1);
  render(`<div class="stack"><h1>Revisar y cerrar ${esc(nomMes(S.periodo))}</h1>
    <p class="muted">El programa comprueba que lo registrado cuadre. Cerrar el mes evita cambios accidentales; las correcciones posteriores se hacen en el mes siguiente.</p></div><div id="rev"><p class="muted">Revisando…</p></div>`);
  try {
    const r = await api(E("revision") + "?periodo=" + S.periodo);
    if (!$("#rev")) return;
    const todoOk = r.controles.every(c => c.ok);
    const avisos = (!i.f29_registrado ? `<div class="msg warn"><b>Todavía no registra el impuesto de este mes (paso 3).</b>
          <span>Si cierra ahora, ya no podrá registrarlo en ${esc(nomMes(S.periodo))}.</span><div><button class="btn" type="button" data-ir="f29">Ir al paso 3</button></div></div>` : "")
      + (enCurso ? `<div class="msg warn"><b>${esc(nomMesCap(S.periodo))} todavía no termina.</b><span>Podrá cerrarlo cuando termine el mes, después de declarar su impuesto.</span></div>` : "");
    $("#rev").innerHTML = `<div class="panel"><h2>Comprobaciones</h2>
      ${r.controles.map(c => `<div class="check"><span class="i ${c.ok ? "ok" : "bad"}" aria-hidden="true">${c.ok ? "✓" : "!"}</span><div><b>${esc(c.nombre)}</b> — ${c.ok ? "correcto" : "revisar"}<br><span class="small muted">${amable(esc(c.detalle))}</span></div></div>`).join("")}
      ${todoOk ? `<div class="msg ok">Todo cuadra.</div>` : `<div class="msg bad">Hay diferencias. Revíselas con su contador antes de cerrar.</div>`}</div>
      ${r.cerrado ? `<div class="msg ok" id="czListo" tabindex="-1"><b>${esc(nomMesCap(S.periodo))} está cerrado.</b><div><button class="btn" type="button" data-irmes="${sig}">Ir a ${esc(nomMes(sig))}</button></div></div>`
        : `<div class="panel"><h2>Cerrar el mes</h2>${avisos}
          <p class="muted">Después de cerrar no podrá agregar, borrar ni anular movimientos de este mes. El programa no tiene una opción para reabrir un mes cerrado.</p>
          <div id="cz"><button class="btn" type="button" id="bCerrar"${enCurso ? " disabled" : ""}>Cerrar ${esc(nomMes(S.periodo))}…</button></div></div>`}
      <details><summary>Obligaciones según su régimen</summary><div class="stack small">${r.obligaciones.map(o => `<div><b>${esc(o.texto)}</b><br><span class="muted">${esc(o.norma)}${o.estado !== "VERIFICADO" ? ` · <span class="pill warn">por confirmar</span>` : ""}</span></div>`).join("")}</div></details>`;
    const b = $("#bCerrar");
    if (b) b.onclick = () => {
      $("#cz").innerHTML = `<div class="confirm" role="group" aria-labelledby="czQ"><b id="czQ">¿Cerrar ${esc(nomMes(S.periodo))}?</b>
        <label class="row" style="gap:8px;font-weight:400;align-items:start"><input type="checkbox" id="czChk" style="margin-top:6px"> Entiendo que después no podré agregar, borrar ni anular movimientos de ${esc(nomMes(S.periodo))}.</label><div id="czE"></div>
        <div class="row"><button class="btn danger" type="button" id="czSi" disabled>Sí, cerrar el mes</button><button class="btn" type="button" id="czNo">Cancelar</button></div></div>`;
      $("#czChk").onchange = () => $("#czSi").disabled = !$("#czChk").checked;
      $("#czNo").onclick = pantallaCierre;
      $("#cz").onkeydown = ev => { if (ev.key === "Escape") pantallaCierre(); };
      $("#czNo").focus();
      $("#czSi").onclick = async () => {
        $("#czSi").disabled = true;
        try { await api(E("cerrar"), { periodo: S.periodo }); toast("Mes cerrado"); ir("cierre", { reemplazar: true }); }
        catch (e) { $("#czSi").disabled = !$("#czChk").checked; error($("#czE"), e); }
      };
    };
  } catch (e) { error($("#rev"), e); }
}

/* ------------------------------------------------------------ libros */
const NOMBRE_PEST = { resultados: "Ganancias y pérdidas", documentos: "Documentos", diario: "Libro Diario", mayor: "Libro Mayor", balance: "Balance 8 columnas" };
const DESC_PEST = {
  resultados: "Ingresos, gastos y el resultado según lo registrado.",
  documentos: "Las facturas y boletas importadas, con su estado en el SII.",
  diario: "Todos los registros contables en orden de fecha (lo usa su contador).",
  mayor: "Los movimientos de una sola cuenta, por ejemplo Banco o Clientes, con su saldo.",
  balance: "Resumen de todas las cuentas con sus sumas y saldos (lo suelen pedir el banco o el contador).",
};
let modoCorregir = false;  // Documentos: las casillas para borrar solo se muestran al pedirlas
async function pantallaLibros() {
  modoCorregir = false;
  const a = render(`<div class="stack"><h1>Libros e informes</h1>
    <div class="row"><span>Mostrar:</span><div class="seg" role="group" id="alc" aria-label="Período"><button type="button" data-a="mes" aria-pressed="true">${esc(nomMes(S.periodo))}</button><button type="button" data-a="anio" aria-pressed="false">Todo ${S.periodo.slice(0, 4)}</button></div>
    <a class="btn" id="xls" href="#">Descargar Excel</a></div></div>
    <div class="stack" style="gap:6px"><div class="tabs" role="tablist" aria-label="Libros">${PESTANAS
      .map(k => `<button type="button" role="tab" id="tab-${k}" aria-controls="lib" data-t="${k}" aria-selected="${k === pestana}" tabindex="${k === pestana ? 0 : -1}">${NOMBRE_PEST[k]}</button>`).join("")}</div>
    <p class="small muted" id="pestDesc"></p></div><div id="lib" role="tabpanel"></div>`);
  let alc = "mes";
  const q = () => alc === "mes" ? "periodo=" + S.periodo : "anio=" + S.periodo.slice(0, 4);
  const pintar = () => {
    $("#xls").href = `/api/${E("excel")}?${q()}`;
    $("#pestDesc").textContent = DESC_PEST[pestana];
    $("#lib").setAttribute("aria-labelledby", "tab-" + pestana);
    libro(pestana, q());
  };
  const tabs = [...a.querySelectorAll("[data-t]")];
  const elegir = b => {
    pestana = b.dataset.t;
    tabs.forEach(x => { x.setAttribute("aria-selected", x === b); x.tabIndex = x === b ? 0 : -1; });
    anotarRuta(true); pintar();
  };
  tabs.forEach(b => b.onclick = () => elegir(b));
  // Pestañas con el teclado: flechas, Inicio y Fin.
  $(".tabs", a).onkeydown = ev => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[ev.key];
    if (j === undefined) return;
    ev.preventDefault();
    const b = tabs[(j + tabs.length) % tabs.length];
    b.focus(); elegir(b);
  };
  a.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { alc = b.dataset.a; a.querySelectorAll("[data-a]").forEach(x => x.setAttribute("aria-pressed", x === b)); pintar(); });
  pintar();
}
// Nombre corto del tipo de documento para la tabla; el nombre completo queda en el «title».
const tipoCorto = t => String(t).replace(/^Factura no afecta o exenta/i, "Factura exenta").replace(/\s+electr[oó]nica/gi, "");
const alcance = q => q.startsWith("periodo=") ? nomMes(q.split("=")[1]) : "año " + q.split("=")[1];
async function libro(t, q) {
  const el = $("#lib"); el.innerHTML = `<p class="muted">Cargando…</p>`;
  const vigente = () => el.isConnected && pestana === t;
  try {
    if (t === "resultados") {
      const r = await api(E("resultados") + "?" + q);
      if (!vigente()) return;
      const ing = r.detalle.filter(x => x.tipo === "ingreso"), gas = r.detalle.filter(x => x.tipo === "gasto");
      el.innerHTML = `<div class="tiles"><div class="tile"><span class="k">Ingresos</span><span class="v">${peso(r.ingresos)}</span></div>
        <div class="tile"><span class="k">Gastos y costos</span><span class="v">${peso(r.gastos)}</span></div>
        <div class="tile"><span class="k">${r.resultado >= 0 ? "Ganancia" : "Pérdida"}</span><span class="v">${peso(r.resultado)}</span></div></div>
        <div class="tablewrap"><table><caption class="sr">Ganancias y pérdidas, ${esc(alcance(q))}</caption><thead><tr><th scope="col">Cuenta</th><th scope="col" class="num">Monto</th></tr></thead><tbody><tr class="head"><td>Ingresos</td><td></td></tr>${ing.map(x => `<tr><td>${esc(x.nombre)}</td><td class="num">${peso(x.monto)}</td></tr>`).join("")}
        <tr class="head"><td>Gastos y costos</td><td></td></tr>${gas.map(x => `<tr><td>${esc(x.nombre)}</td><td class="num">${peso(x.monto)}</td></tr>`).join("")}
        <tr class="sum"><td>Resultado</td><td class="num">${peso(r.resultado)}</td></tr></tbody></table></div>
        <p class="small muted">Resultado contable según lo registrado. No es la renta líquida imponible del F22.</p>`;
    } else if (t === "documentos") {
      if (!q.startsWith("periodo")) { el.innerHTML = `<p class="muted">Elija un mes para ver sus documentos.</p>`; return; }
      const [r, est] = await Promise.all([api(E("documentos") + "?" + q), api(E("sii-estados") + "?" + q)]);
      if (!vigente()) return;
      const nom = { compra: "Compra", venta: "Venta", honorario_recibido: "Boleta recibida", honorario_emitido: "Boleta emitida" };
      const pillEst = e => e ? `<span class="pill ${e.nivel === "ok" ? "ok" : e.nivel === "revisar" ? "warn" : "bad"}" title="${esc(e.explicacion)} (consultado ${esc(e.consultado)}, ${e.ambiente === "produccion" ? "producción" : "ambiente de pruebas"})">${esc(e.estado || "error")}</span>` : `<span class="small muted">—</span>`;
      const hayFacturas = r.documentos.some(d => d.libro === "compra" || d.libro === "venta");
      const periodo = q.split("=")[1], puede = !r.cerrado && r.documentos.some(d => !d.en_f29);
      const corr = puede && modoCorregir;
      const enF29 = r.documentos.filter(d => d.en_f29).length;
      const tipoDoc = d => r.tipos[d.tipo_dte] || "Boleta de honorarios";
      el.innerHTML = (hayFacturas ? `<details class="panel" id="estSII"><summary><b>Consultar el estado de estas facturas en el SII</b></summary>
          <div class="stack"><p class="muted small">El SII indica si cada factura o nota fue recibida y si sus datos coinciden. Necesita su certificado digital; el archivo y la clave se usan solo en memoria. La consulta no modifica nada en el SII.</p>
          <div class="grid2">
            <label for="eqPfx">Archivo del certificado<input id="eqPfx" type="file" accept=".pfx,.p12"></label>
            <label for="eqClave">Clave del certificado<input id="eqClave" type="password" autocomplete="off"></label>
            <label for="eqRut">RUT de la persona titular del certificado<span class="hint">Quien hace la consulta</span><input id="eqRut" type="text" placeholder="12.345.678-9"></label>
            <label for="eqAmb">Ambiente del SII<select id="eqAmb"><option value="produccion">Producción (facturas reales)</option><option value="certificacion">Pruebas del SII (certificación)</option></select></label>
            <label for="eqLibro">Documentos<select id="eqLibro"><option value="">Compras y ventas</option><option value="compra">Solo compras</option><option value="venta">Solo ventas</option></select></label>
          </div>
          <div><button class="btn primary" type="button" id="eqBtn">Consultar en el SII</button></div><div id="eqRes"></div></div></details>` : "")
        + (r.documentos.length ? `
        ${puede ? (corr ? `<div class="msg warn" id="docModo"><b>Modo corrección.</b><span>Elija los documentos importados por error y presione «Borrar los elegidos». Sus registros contables se anulan y dejan de contar en el F29.</span>
            ${enF29 ? `<span>El F29 de este mes ya está registrado (N° ${esc(r.f29_asiento)}). Los ${enF29} documentos que entraron en él no se pueden borrar sin anular primero ese registro en «Pagos y cobros»; los importados después, sí.</span>` : ""}
            <div><button class="btn" type="button" id="docTerminar">Terminar la corrección</button></div></div>`
          : `<div><button class="btn" type="button" id="docCorregir">Corregir: borrar documentos importados por error</button></div>`)
          : r.cerrado ? `<p class="small muted">Este mes está cerrado: sus documentos no se pueden borrar.</p>` : ""}
        <div class="row"><label for="docFiltro" class="row" style="gap:8px">Buscar<input id="docFiltro" type="search" autocomplete="off" placeholder="RUT, nombre o N°" style="width:260px"></label>
          <span class="small muted" id="docN" aria-live="polite">${r.documentos.length} documento${r.documentos.length === 1 ? "" : "s"}</span></div>
        <div class="tablewrap"><table><thead><tr>${corr ? `<th><input type="checkbox" id="docTodos" aria-label="${enF29 ? "Elegir todos los que se pueden borrar" : "Elegir todos los documentos"}"></th>` : ""}<th>Tipo</th><th>Documento</th><th>Fecha</th><th>RUT</th><th>Nombre</th><th class="num">Neto/Bruto</th><th class="num">IVA/Retención</th><th class="num">Total</th><th>Estado SII</th></tr></thead><tbody>
        ${r.documentos.map(d => `<tr data-buscar="${esc(normBusca([d.rut_contraparte, d.razon_social, d.folio, tipoDoc(d), nom[d.libro]].join(" ")))}">${corr ? `<td>${d.en_f29 ? `<span class="small muted" title="Entró en el F29 registrado del mes">F29</span>` : `<input type="checkbox" class="docSel" value="${d.id}" aria-label="Elegir ${esc(nom[d.libro])} N° ${esc(d.folio)}">`}</td>` : ""}<td class="nw">${nom[d.libro]}</td><td><span title="${esc(tipoDoc(d))}">${esc(tipoCorto(tipoDoc(d)))}</span> N°&nbsp;${esc(d.folio)}</td><td class="fecha">${fechaCorta(d.fecha)}</td><td class="nw">${esc(fmtRut(d.rut_contraparte))}</td><td>${esc(d.razon_social)}</td>
          <td class="num">${peso(d.bruto || d.neto + d.exento)}</td><td class="num">${peso(d.retencion || d.iva)}</td><td class="num">${peso(d.total)}</td><td>${pillEst(est.estados[String(d.id)])}</td></tr>`).join("")}</tbody></table></div>
        ${corr ? `<div class="row"><button class="btn danger" type="button" id="docBorrar" disabled>Borrar los elegidos</button><span class="small muted" id="docCuenta">Marque los documentos que quiere borrar.</span></div>` : ""}`
        : `<p class="muted">No hay documentos en este mes.${r.cerrado ? "" : ` <button class="btn link" type="button" data-ir="archivos">Subir los archivos del SII</button>`}</p>`)
        + `<div id="docConf"></div>`
        + (r.eliminados.length ? `<details class="panel"><summary>Documentos borrados de este mes (${r.eliminados.length})</summary>
          <div class="tablewrap"><table><thead><tr><th>Documento</th><th>RUT</th><th class="num">Total</th><th>Borrado</th><th>Motivo</th><th>Anulado con</th></tr></thead><tbody>
          ${r.eliminados.map(d => `<tr><td>${nom[d.libro]}: ${esc(tipoDoc(d))} N° ${esc(d.folio)}</td><td class="nw">${esc(fmtRut(d.rut_contraparte))}</td><td class="num">${peso(d.total)}</td>
            <td class="fecha">${esc(String(d.eliminado || "").slice(0, 16).replace(/^(\d{4})-(\d{2})-(\d{2})/, "$3-$2-$1"))}</td><td>${esc(d.motivo)}</td><td>${d.asiento ? "N° " + esc(d.asiento) : "—"}</td></tr>`).join("")}</tbody></table></div></details>` : "");
      const filas = [...el.querySelectorAll("tbody tr[data-buscar]")];
      const contar = () => {
        if (!corr) return;
        const n = sel().length; $("#docBorrar").disabled = !n; $("#docCuenta").textContent = n ? `${n} elegido${n === 1 ? "" : "s"}` : "Marque los documentos que quiere borrar.";
        if ($("#docConf .bSi")) $("#docConf").innerHTML = "";  // la confirmación era para otra selección
      };
      // Solo cuentan las filas a la vista: lo que oculta la búsqueda nunca se borra.
      const sel = () => filas.filter(f => !f.hidden).map(f => f.querySelector(".docSel:checked")).filter(Boolean).map(x => +x.value);
      if ($("#docFiltro")) $("#docFiltro").oninput = () => {
        const b = normBusca($("#docFiltro").value);
        let n = 0;
        filas.forEach(f => { f.hidden = !!b && !f.dataset.buscar.includes(b); if (f.hidden) { const c = f.querySelector(".docSel"); if (c) c.checked = false; } else n++; });
        $("#docN").textContent = b ? `${n} de ${filas.length} documentos` : `${filas.length} documento${filas.length === 1 ? "" : "s"}`;
        if ($("#docTodos")) $("#docTodos").checked = false;
        contar();
      };
      if ($("#docCorregir")) $("#docCorregir").onclick = async () => { modoCorregir = true; await libro("documentos", q); const m = $("#docModo"); if (m) m.scrollIntoView({ block: "nearest" }); };
      if ($("#docTerminar")) $("#docTerminar").onclick = () => { modoCorregir = false; libro("documentos", q); };
      if (corr) {
        el.querySelectorAll(".docSel").forEach(x => x.onchange = contar);
        $("#docTodos").onchange = () => { filas.filter(f => !f.hidden).forEach(f => { const c = f.querySelector(".docSel"); if (c) c.checked = $("#docTodos").checked; }); contar(); };
        $("#docBorrar").onclick = () => {
          const ids = sel(), total = el.querySelectorAll(".docSel").length;
          confirmarBorrado($("#docConf"), { ids, motivo: "Importado por error",
            texto: ids.length === total && total > 1 ? `¿Borrar los ${total} documentos de ${nomMes(periodo)} que se pueden borrar?` : `¿Borrar ${ids.length} documento${ids.length === 1 ? "" : "s"} de ${nomMes(periodo)}?`,
            alListo: async () => { const html = $("#docConf").innerHTML; await libro("documentos", q);
              if ($("#docConf")) { $("#docConf").innerHTML = html; const m = $("#docConf .msg"); if (m) m.focus(); } } });
          $("#docConf").scrollIntoView({ behavior: suave(), block: "center" });
        };
      }
      const btn = $("#eqBtn");
      if (btn) btn.onclick = async () => {
        const f = $("#eqPfx").files[0];
        if (!f) { error($("#eqRes"), new Error("Elija el archivo de su certificado (.pfx o .p12).")); return; }
        btn.disabled = true; btn.textContent = "Consultando… puede tardar un poco";
        try {
          const x = await api(E("sii-estado"), { periodo: q.split("=")[1], pfx: await aBase64(f), clave: $("#eqClave").value,
            rut_consultante: $("#eqRut").value, ambiente: $("#eqAmb").value, libro: $("#eqLibro").value });
          const s = x.resumen;
          const malos = x.resultados.filter(d => d.nivel !== "ok");
          $("#eqRes").innerHTML = `<div class="msg ${malos.length ? "warn" : "ok"}"><b>Consulta terminada: ${x.resultados.length} documentos.</b>
            <span>Correctos: ${s.ok || 0} · Para revisar: ${s.revisar || 0} · Con problemas: ${s.problema || 0}${s.error ? ` · Sin respuesta: ${s.error}` : ""}</span>
            ${malos.length ? `<ul>${malos.map(d => `<li>${esc(r.tipos[d.tipo] || "Documento")} N° ${esc(d.folio)} (${esc(d.razon_social || "")}): <b>${esc(d.estado || "error")}</b> — ${esc(d.explicacion)}</li>`).join("")}</ul>` : ""}</div>`;
          toast("Consulta al SII terminada");
          const html = $("#eqRes").innerHTML;
          await libro("documentos", q);
          const det2 = $("#estSII"); if (det2) { det2.open = true; $("#eqRes").innerHTML = html; }
        } catch (e) { error($("#eqRes"), e); btn.disabled = false; btn.textContent = "Consultar en el SII"; }
      };
    } else if (t === "diario") {
      const r = await api(E("diario") + "?" + q);
      if (!vigente()) return;
      let td = 0, th = 0;
      r.asientos.forEach(a => a.lineas.forEach(l => { td += l.debe; th += l.haber; }));
      el.innerHTML = r.asientos.length ? `<div class="tablewrap"><table><caption class="sr">Libro Diario, ${esc(alcance(q))}</caption><thead><tr><th>N°</th><th>Fecha</th><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>
        ${r.asientos.map(a => `<tr class="head ${a.anulado ? "anulado" : ""}"><td>${a.numero}</td><td class="fecha">${fechaCorta(a.fecha)}</td><td colspan="3">${amable(esc(a.glosa))}</td></tr>`
          + a.lineas.map(l => `<tr><td></td><td></td><td>${esc(l.cuenta)} ${esc(l.nombre)}</td><td class="num">${l.debe ? peso(l.debe) : ""}</td><td class="num">${l.haber ? peso(l.haber) : ""}</td></tr>`).join("")).join("")}
        <tr class="sum"><td></td><td></td><td>Sumas</td><td class="num">${peso(td)}</td><td class="num">${peso(th)}</td></tr>
        </tbody></table></div>` : `<p class="muted">Sin registros en este período.</p>`;
    } else if (t === "mayor") {
      // Por defecto, la última cuenta consultada o la primera con movimientos en el período.
      const [c, bal] = await Promise.all([S.catalogo ? Promise.resolve(S.catalogo) : api(E("catalogo")), api(E("balance") + "?" + q)]);
      if (!vigente()) return;
      S.catalogo = c;
      const con = new Set(bal.filas.map(f => f.codigo)), opt = x => `<option value="${esc(x.codigo)}">${esc(x.codigo)} ${esc(x.nombre)}</option>`;
      const conMov = c.cuentas.filter(x => con.has(x.codigo)), otras = c.cuentas.filter(x => !con.has(x.codigo));
      el.innerHTML = `<label for="mc" style="max-width:520px">Cuenta<select id="mc">${conMov.length ? `<optgroup label="Con movimientos">${conMov.map(opt).join("")}</optgroup><optgroup label="Otras cuentas">${otras.map(opt).join("")}</optgroup>` : c.cuentas.map(opt).join("")}</select></label><div id="mt"></div>`;
      const cargar = async () => {
        const cuenta = $("#mc").value;
        guardar("mayor:" + S.empresa, cuenta);
        const r = await api(E("mayor") + `?${q}&cuenta=${encodeURIComponent(cuenta)}`);
        if (!$("#mt") || $("#mc").value !== cuenta) return;
        $("#mt").innerHTML = `<div class="tablewrap"><table><caption class="sr">Libro Mayor de la cuenta ${esc(cuenta)}, ${esc(alcance(q))}</caption><thead><tr><th>N°</th><th>Fecha</th><th>Descripción</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead><tbody>
          <tr class="head"><td colspan="5">Saldo inicial</td><td class="num">${peso(r.inicial)}</td></tr>
          ${r.movimientos.length ? r.movimientos.map(m => `<tr><td>${m.numero}</td><td class="fecha">${fechaCorta(m.fecha)}</td><td>${amable(esc(m.glosa))}</td><td class="num">${m.debe ? peso(m.debe) : ""}</td><td class="num">${m.haber ? peso(m.haber) : ""}</td><td class="num">${peso(m.saldo)}</td></tr>`).join("")
            : `<tr><td colspan="6" class="muted">Esta cuenta no tiene movimientos en el período.</td></tr>`}</tbody></table></div>`;
      };
      const previa = leer("mayor:" + S.empresa);
      $("#mc").value = previa && con.has(previa) ? previa : conMov.length ? conMov[0].codigo : (previa && c.cuentas.some(x => x.codigo === previa) ? previa : "1.1.02");
      if (!$("#mc").value && c.cuentas.length) $("#mc").value = c.cuentas[0].codigo;
      $("#mc").onchange = () => cargar().catch(e => error($("#mt"), e));
      await cargar();
    } else if (t === "balance") {
      const r = await api(E("balance") + "?" + q);
      if (!vigente()) return;
      const H = ["Débitos", "Créditos", "Deudor", "Acreedor", "Activo", "Pasivo", "Pérdida", "Ganancia"];
      el.innerHTML = `<div class="tablewrap"><table class="bal"><caption class="sr">Balance de 8 columnas, ${esc(alcance(q))}</caption><thead><tr><th>Cuenta</th>${H.map(h => `<th class="num">${h}</th>`).join("")}</tr></thead><tbody>
        ${r.filas.map(f => `<tr><td>${esc(f.codigo)} ${esc(f.nombre)}</td>${f.v.map(x => `<td class="num">${x ? peso(x) : ""}</td>`).join("")}</tr>`).join("")}
        <tr class="sum"><td>Sumas</td>${r.totales.map(x => `<td class="num">${peso(x)}</td>`).join("")}</tr>
        <tr><td>${r.resultado >= 0 ? "Utilidad" : "Pérdida"} del ejercicio</td><td></td><td></td><td></td><td></td>
          <td class="num">${r.resultado < 0 ? peso(-r.resultado) : ""}</td><td class="num">${r.resultado >= 0 ? peso(r.resultado) : ""}</td>
          <td class="num">${r.resultado >= 0 ? peso(r.resultado) : ""}</td><td class="num">${r.resultado < 0 ? peso(-r.resultado) : ""}</td></tr></tbody></table></div>`;
    }
  } catch (e) { if (el.isConnected) error(el, e); }
}

/* ------------------------------------------------------------ ayuda */
function pantallaSII() {
  render(`<div><button class="btn link" type="button" id="siiV">← Volver a la Ayuda</button></div>
    <div class="stack"><h1>Probar el certificado digital (para contadores)</h1>
      <p class="muted">Compruebe que su computador se conecta con los servicios web del SII y que su certificado digital funciona. No se envía ni se modifica ninguna declaración: solo se pide un permiso de acceso de prueba.</p>
      <div class="msg info"><span><b>Para traer sus compras y ventas no necesita esto.</b> Use el paso 1, «Subir los archivos del SII», y presione «Ingresar al SII».</span>
        ${S.empresa ? `<div><button class="btn" type="button" data-ir="archivos">Ir al paso 1</button></div>` : ""}</div></div>
    <div class="panel"><label for="siiAmb" style="max-width:520px">Ambiente del SII
      <select id="siiAmb"><option value="certificacion">Pruebas del SII (recomendado)</option><option value="produccion">Producción</option></select></label></div>
    <div class="panel"><h2>1. Conexión</h2><p class="muted">No necesita certificado. El programa pide al SII un código de prueba (semilla).</p>
      <div><button class="btn primary" type="button" id="siiSem">Probar conexión</button></div><div id="siiSemR"></div></div>
    <div class="panel"><h2>2. Certificado digital</h2>
      <p class="muted">Elija el archivo de su certificado (.pfx o .p12) y escriba su clave. El archivo y la clave se usan solo en este computador, en memoria: no se guardan ni se envían a nadie más que al SII para la prueba.</p>
      <div class="grid2"><label for="siiPfx">Archivo del certificado<input id="siiPfx" type="file" accept=".pfx,.p12"></label>
        <label for="siiClave">Clave del certificado<input id="siiClave" type="password" autocomplete="off"></label></div>
      <div class="row"><button class="btn" type="button" id="siiRev">Revisar certificado</button><button class="btn primary" type="button" id="siiTok">Probar certificado con el SII</button></div>
      <div id="siiCertR"></div></div>
    <details><summary>¿Qué significa cada resultado?</summary><div class="stack small">
      <p><b>Conexión correcta:</b> su computador llega a los servicios del SII.</p>
      <p><b>Certificado revisado:</b> el archivo y la clave son correctos; se muestra a nombre de quién está y hasta cuándo vale.</p>
      <p><b>Certificado aceptado por el SII:</b> el SII validó la firma y entregó un permiso de acceso. Con esto se pueden usar los servicios web del SII.</p>
      <p><b>Rechazado:</b> el mensaje del SII indica el motivo, por ejemplo un certificado vencido o no reconocido.</p></div></details>`);
  $("#siiV").onclick = () => S.empresa ? ir("ayuda") : pantallaAyuda();
  const amb = () => $("#siiAmb").value;
  const pfx = async () => { const f = $("#siiPfx").files[0]; if (!f) throw new Error("Elija el archivo de su certificado (.pfx o .p12)."); return aBase64(f); };
  const ocupado = (b, t) => { b.disabled = true; const o = b.textContent; b.textContent = t; return () => { b.disabled = false; b.textContent = o; }; };
  $("#siiSem").onclick = async () => {
    const fin = ocupado($("#siiSem"), "Conectando…");
    try { const r = await api("sii-semilla", { ambiente: amb() });
      $("#siiSemR").innerHTML = `<div class="msg ok"><b>Conexión correcta con el SII.</b><span>Código de prueba recibido: ${esc(r.semilla)}</span></div>`;
    } catch (e) { error($("#siiSemR"), e); } finally { fin(); }
  };
  const mostrarCert = c => `<div class="msg ${c.vigente ? "ok" : "bad"}"><b>${c.vigente ? "Certificado revisado: archivo y clave correctos." : "El certificado no está vigente."}</b>
    <span>Titular: ${esc(c.titular || "—")}${c.identificador ? ` · Identificador: ${esc(c.identificador)}` : ""}</span>
    <span>Emitido por: ${esc(c.emisor || "—")}</span>
    <span>Válido desde ${esc(c.valido_desde)} hasta ${esc(c.valido_hasta)}${c.vigente ? ` (quedan ${c.dias_restantes} días)` : ""}</span></div>`;
  $("#siiRev").onclick = async () => {
    const fin = ocupado($("#siiRev"), "Revisando…");
    try { const c = await api("sii-certificado", { pfx: await pfx(), clave: $("#siiClave").value }); $("#siiCertR").innerHTML = mostrarCert(c); }
    catch (e) { error($("#siiCertR"), e); } finally { fin(); }
  };
  $("#siiTok").onclick = async () => {
    const fin = ocupado($("#siiTok"), "Consultando al SII…");
    try { const r = await api("sii-token", { pfx: await pfx(), clave: $("#siiClave").value, ambiente: amb() });
      $("#siiCertR").innerHTML = mostrarCert(r.certificado) + `<div class="msg ok"><b>Certificado aceptado por el SII (${r.ambiente === "produccion" ? "producción" : "ambiente de pruebas"}).</b><span>Permiso de acceso recibido: ${esc(r.token_parcial)}</span></div>`;
    } catch (e) { error($("#siiCertR"), e); } finally { fin(); }
  };
}

function pantallaAyuda() {
  render(`${S.empresa ? "" : `<div><button class="btn link" type="button" id="ayV">← Volver</button></div>`}
    <div class="stack"><h1>Ayuda</h1><p>Este programa lleva la contabilidad con los archivos que usted descarga del SII. Cada mes siga los cuatro pasos que aparecen arriba y en la pantalla de inicio del mes.</p></div>
    <div class="panel"><h2>Si se equivocó</h2><dl class="glos">
      <dt>Subí un archivo equivocado</dt><dd>Presione «Deshacer esta importación» en la tarjeta del archivo, o borre los documentos en «Libros e informes» → «Documentos» → «Corregir».</dd>
      <dt>Anoté mal una boleta a mano</dt><dd>Presione «Borrar esta boleta» justo después de registrarla, o bórrela en «Documentos».</dd>
      <dt>Anoté mal un pago o cobro</dt><dd>En «Registrar pagos y cobros», presione «Anular» en ese registro y anótelo de nuevo.</dd>
      <dt>Registré mal el impuesto (F29)</dt><dd>Anule su registro en «Registrar pagos y cobros» y vuelva a confirmar el F29.</dd>
      <dt>Borré un documento que sí era</dt><dd>Vuelva a importar el archivo: el documento se registra de nuevo, con un aviso.</dd>
      <dt>Envié una empresa a la papelera</dt><dd>En la pantalla «¿De quién es la contabilidad?», abra «Papelera» al final y presione «Restaurar».</dd>
      <dt>Cerré un mes por error</dt><dd>El programa no permite reabrirlo. Las correcciones se hacen en el mes siguiente; consulte a su contador.</dd>
    </dl></div>
    <div class="panel"><h2>Palabras que verá</h2><dl class="glos">
      <dt>IVA débito</dt><dd>El IVA que usted cobró en sus ventas. Se lo debe al SII.</dd>
      <dt>IVA crédito</dt><dd>El IVA que usted pagó en sus compras. Se descuenta del IVA débito.</dd>
      <dt>IVA a favor (remanente)</dt><dd>Si pagó más IVA en compras que el que cobró en ventas, la diferencia pasa al mes siguiente.</dd>
      <dt>PPM</dt><dd>Pago provisional mensual: un adelanto del impuesto a la renta anual, calculado sobre sus ventas.</dd>
      <dt>Retención de honorarios</dt><dd>Parte de una boleta de honorarios que quien la paga retiene y entera al SII.</dd>
      <dt>Impuesto único</dt><dd>El impuesto de los sueldos de los trabajadores, que el empleador descuenta y paga en el F29.</dd>
      <dt>UTM</dt><dd>Unidad tributaria mensual: un valor en pesos que cambia cada mes. Se consulta en sii.cl, «Valores y fechas».</dd>
      <dt>F29</dt><dd>Formulario mensual del SII donde se declaran y pagan el IVA, el PPM y las retenciones.</dd>
      <dt>RCV</dt><dd>Registro de Compras y Ventas que el SII arma con sus facturas electrónicas.</dd>
      <dt>Nota de crédito</dt><dd>Documento que anula o rebaja una factura ya emitida.</dd>
      <dt>Régimen tributario</dt><dd>La forma en que tributa la empresa o persona. Aparece en su carpeta tributaria del SII.</dd>
      <dt>Registro contable (asiento)</dt><dd>La anotación de una operación en la contabilidad. El programa los hace por usted.</dd>
      <dt>Debe y Haber</dt><dd>Las dos columnas de cada registro contable. En cada registro, el total del Debe es igual al del Haber.</dd>
      <dt>Anular</dt><dd>En contabilidad nada se borra: un error se corrige con un registro contrario que lo deja sin efecto.</dd>
      <dt>Libro Diario</dt><dd>Todos los registros contables en orden de fecha.</dd>
      <dt>Libro Mayor</dt><dd>Los movimientos de una sola cuenta, por ejemplo Banco, con su saldo.</dd>
      <dt>Balance de 8 columnas</dt><dd>Resumen de todas las cuentas con sus sumas y saldos.</dd>
      <dt>Cerrar el mes</dt><dd>Bloquear el mes para que no se modifique después de declarar.</dd>
    </dl></div>
    <div class="panel"><h2>Sus datos</h2><p>Todo se guarda en su computador, en esta carpeta: <b id="carpetaDatos">…</b>. No se envía nada a internet, salvo las consultas al SII que usted pida.</p>
      <p><b>Haga una copia de esa carpeta</b> regularmente, por ejemplo en un pendrive o en OneDrive.</p></div>
    <div class="panel"><h2>Herramientas para contadores</h2>
      <p class="muted">Comprueba que el certificado digital funciona con los servicios web del SII. No es necesario para traer compras y ventas.</p>
      <div><button class="btn" type="button" id="aySII">Probar el certificado digital</button></div></div>
    <div class="panel"><h2>Importante</h2><p>Los cálculos de impuestos son un borrador de apoyo. Compárelos siempre con la propuesta del SII y consulte a su contador ante cualquier duda. Los avisos «Para revisar» o «Revise esto» (en amarillo, con una franja a la izquierda) indican casos que el programa no resuelve solo.</p></div>`);
  const b = $("#ayV"); if (b) b.onclick = () => pantallaEmpresas();
  $("#aySII").onclick = () => S.empresa ? ir("sii") : pantallaSII();
  api("carpeta").then(r => { $("#carpetaDatos").textContent = r.carpeta; }).catch(() => {});
}
